spring.config.import=optional:file:.env[.properties]

spring.application.name=jansunwai
server.port=8080

# Database. The password comes only from the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jansunwai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Run schema.sql, then data.sql, on every start (both are safe to repeat)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
