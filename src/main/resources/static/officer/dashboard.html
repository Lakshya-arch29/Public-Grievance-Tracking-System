<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Officer Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">
        <img src="../img/logo-mark.png" class="nav-logo" alt="">
        <h2>JanSewa</h2>
    </header>

    <main class="dashboard">

        <h1>Officer Dashboard</h1>

        <div class="stats">

            <div class="stat-card">
                <h3>Assigned</h3>
                <p id="assignedCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingCount">0</p>
            </div>

            <div class="stat-card">
                <h3>In Progress</h3>
                <p id="inProgressCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Resolved</h3>
                <p id="resolvedCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Rejected</h3>
                <p id="rejectedCount">0</p>
            </div>

        </div>

        <h2>My Grievances</h2>

        <div class="filters">

            <select id="statusFilter" onchange="applyOfficerFilters()">
                <option value="">All Status</option>
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="REJECTED">Rejected</option>
            </select>

            <select id="priorityFilter" onchange="applyOfficerFilters()">
                <option value="">All Priority</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>

            <input
                type="text"
                id="searchInput"
                placeholder="Search title or area"
                onkeyup="if(event.key==='Enter') applyOfficerFilters()"
            >

            <button onclick="applyOfficerFilters()">Search</button>

        </div>

        <div id="grievanceList">
            <p>Loading grievances…</p>
        </div>

    </main>

    <a href="#" class="logout-button" onclick="logout()">Logout</a>

    <script src="../js/api.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/officer.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
