<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Officers - JanSewa</title>

    <link rel="stylesheet" href="../css/style-cyber.css">
</head>

<body>

    <header class="navbar"><img src="../img/logo-mark.png" class="nav-logo" alt=""><h2>JanSewa</h2></header>

    <h1>Officer Management</h1>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="grievances.html">Grievances</a>
        <a href="officers.html">Officers</a>
    </nav>

    <h2>Officer Directory</h2>

    <div class="filters" style="width:min(1100px,92%);margin:0 auto 18px;">
        <input
            type="text"
            id="officerSearch"
            placeholder="Search officers by name or username"
            onkeyup="if(event.key==='Enter') loadOfficers()"
        >

        <select id="activeFilter">
            <option value="">All Officers</option>
            <option value="true">Active</option>
            <option value="false">Inactive</option>
        </select>

        <button onclick="loadOfficers()">Search</button>
    </div>

    <table border="1">

        <thead>
            <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>City</th>
                <th>Status</th>
                <th>Pending</th>
                <th>Resolved</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="officerTable">
            <tr>
                <td colspan="8" style="text-align:center;color:var(--muted)">Loading…</td>
            </tr>
        </tbody>

    </table>

    <h2 style="margin-top:32px;">Add New Officer</h2>

    <div class="form-card" style="margin-bottom:80px;">
        <form id="officerForm">

            <label for="officerName">Full Name</label>
            <input type="text" id="officerName" placeholder="Officer's full name" required>

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="4-30 letters, digits or _" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="officer@example.com" required>

            <label for="phone">Phone (10 digits)</label>
            <input type="text" id="phone" inputmode="numeric" maxlength="10" placeholder="9876543210" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 8 characters" required>

            <label for="officerCity">City</label>
            <select id="officerCity" required>
                <option value="">Loading cities…</option>
            </select>

            <button type="submit">Create Officer</button>

            <p id="officerMessage" style="text-align:center;min-height:1.4em;margin-top:10px;"></p>

        </form>
    </div>

    <a href="#" class="logout-button" onclick="logout()">Logout</a>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
