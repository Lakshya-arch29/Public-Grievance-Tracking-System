<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Grievances - JanSunwai</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <h1>Manage Grievances</h1>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="grievances.html">Grievances</a>
        <a href="officers.html">Officers</a>
   
    </nav>

    <h2>Search and Filter</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search grievances"
    >

    <select id="statusFilter">
        <option value="">All Status</option>
        <option value="PENDING">Pending</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="RESOLVED">Resolved</option>
        <option value="REJECTED">Rejected</option>
    </select>

    <select id="priorityFilter">
        <option value="">All Priority</option>
        <option value="HIGH">High</option>
        <option value="MEDIUM">Medium</option>
        <option value="LOW">Low</option>
    </select>

    <button onclick="loadGrievances()">Search</button>

    <h2>Grievances</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Tracking ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>City</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Officer</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="grievanceTable">
            <tr>
                <td colspan="8">No grievances loaded.</td>
            </tr>
        </tbody>
    </table>

    <br>

    <button onclick="previousPage()">Previous</button>
    <span id="pageNumber">Page 1</span>
    <button onclick="nextPage()">Next</button>

    <script src="../js/admin.js"></script>
    <a href="#" class="logout-button" onclick="logout()">
    Logout
</a>

<script src="../js/logout.js"></script>

</body>
</html>
