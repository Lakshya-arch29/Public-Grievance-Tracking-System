<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Grievances - JanSewa</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar"><img src="../img/logo-mark.png" class="nav-logo" alt=""><h2>JanSewa</h2></header>

    <h1>Manage Grievances</h1>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="grievances.html">Grievances</a>
        <a href="officers.html">Officers</a>
    </nav>

    <h2>Search and Filter</h2>

    <div class="filters" style="width:min(1100px,92%);margin:0 auto 18px;">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by title, tracking ID or area"
            onkeyup="if(event.key==='Enter') loadGrievances()"
        >

        <select id="statusFilter">
            <option value="">All Status</option>
            <option value="PENDING">Pending</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="RESOLVED">Resolved</option>
            <option value="REJECTED">Rejected</option>
        </select>

        <select id="priorityFilter">
            <option value="">All Priority</option>
            <option value="HIGH">High</option>
            <option value="MEDIUM">Medium</option>
            <option value="LOW">Low</option>
        </select>

        <button onclick="loadGrievances()">Search</button>

    </div>

    <h2>Grievances</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Tracking ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>City</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Officer</th>
                <th>Contact Officer</th>
            </tr>
        </thead>

        <tbody id="grievanceTable">
            <tr>
                <td colspan="8" style="text-align:center;color:var(--muted)">Loading…</td>
            </tr>
        </tbody>
    </table>

    <a href="#" class="logout-button" onclick="logout()">Logout</a>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
