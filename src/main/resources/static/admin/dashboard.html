<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - JanSewa</title>

    <link rel="stylesheet" href="../css/style-cyber.css">
</head>

<body>

    <header class="navbar"><img src="../img/logo-mark.png" class="nav-logo" alt=""><h2>JanSewa</h2></header>

    <h1>Admin Dashboard</h1>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="grievances.html">Grievances</a>
        <a href="officers.html">Officers</a>
    </nav>

    <div class="stats" style="width:min(1100px,92%);margin:0 auto 22px;">

        <div class="stat-card">
            <h3>Total Grievances</h3>
            <p id="totalGrievances">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingGrievances">0</p>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <p id="inProgressGrievances">0</p>
        </div>

        <div class="stat-card">
            <h3>Resolved</h3>
            <p id="resolvedGrievances">0</p>
        </div>

        <div class="stat-card">
            <h3>Overdue</h3>
            <p id="overdueGrievances">0</p>
        </div>

        <div class="stat-card">
            <h3>Unassigned</h3>
            <p id="unassignedGrievances">0</p>
        </div>

    </div>

    <a href="#" class="logout-button" onclick="logout()">Logout</a>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
