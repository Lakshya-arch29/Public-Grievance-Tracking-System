<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanSewa - Public Grievance Tracking System</title>
    <link rel="stylesheet" href="css/style-cyber.css">
</head>
<body>

    <section class="hero">
        <img src="img/logo-full.png" alt="JanSewa - Public Grievance Tracking System">
        <p>Report civic problems, track every step, get them resolved.</p>
    </section>

    <h2 class="section-title">Select Your Role</h2>

    <div class="role-container">

        <div class="role-card">
            <h3>Citizen</h3>
            <p>Register your complaint and track its progress.</p>
            <a href="login.html?role=citizen">Citizen Login</a>
        </div>

        <div class="role-card">
            <h3>Officer</h3>
            <p>Manage and update the grievances assigned to you.</p>
            <a href="login.html?role=officer">Officer Login</a>
        </div>

        <div class="role-card">
            <h3>Admin</h3>
            <p>Oversee grievances, officers and statistics.</p>
            <a href="login.html?role=admin">Admin Login</a>
        </div>

    </div>

</body>
</html>
